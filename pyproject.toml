[project]
name = "hrsurvey"
version = "0.1.0"
description = "Standardization and pattern detection for the anonymous employee experience survey"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "de-core-news-md",
    "en-core-web-md",
    "lingua-language-detector>=2.2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "spacy>=3.8.16",
]

[project.scripts]
hrsurvey = "hrsurvey.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrsurvey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["hrsurvey"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hrsurvey"]
known-local-folder = ["conftest", "fixtures"]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
de-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl" }
